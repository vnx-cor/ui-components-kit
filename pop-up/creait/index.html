<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREAIT Pop-up Modal</title>

    <!-- Brand typeface: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Submit Button -->
    <button id="openBtn" class="submit-btn">Submit</button>

    <!-- Pop-up Modal -->
    <div id="popupModal" class="modal" aria-hidden="true">
      <div
        class="modal-content"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
        aria-describedby="modalDesc"
        tabindex="-1"
      >
        <!-- Header band with brand CREAIT's icon -->
        <div class="modal-header">
          <button id="closeBtn" class="close-btn" aria-label="Close dialog">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>

          <!-- CREAIT's Logo -->
          <img
            class="creait-logo"
            src="creait-logo-transparent_bg.png"
            alt="CREAIT's Logo"
          />

          <h2 id="modalTitle">Thank you for contacting us</h2>
        </div>

        <!-- Body -->
        <div class="modal-body" id="modalDesc">
          <p>
            Your form has been successfully submitted to our Support Team. We
            have received your information and will review it accordingly.
          </p>

          <div class="note">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="5" width="18" height="14" rx="2.5" />
              <path d="M3.5 7.5l8.5 6 8.5-6" />
            </svg>
            <p>
              Please check your inbox or spam/junk folder for the confirmation
              and verification email regarding your submission.
            </p>
          </div>
        </div>

        <!-- Footer -->
        <div class="modal-footer">
          <span class="tagline">We are your partner</span>
          <button id="doneBtn" class="done-btn">Done</button>
        </div>
      </div>
    </div>
  </body>
</html>
