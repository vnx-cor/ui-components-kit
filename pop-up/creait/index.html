<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CREAIT Pop-up Modal</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <!-- Submit Button -->
    <button id="openBtn" class="submit-btn">Submit</button>

    <!-- Pop-up Modal -->
    <div id="popupModal" class="modal">
      <div class="modal-content">
        <span id="closeBtn" class="close-btn">&times;</span>
        <h2>Thank You for Contacting Us</h2>
        <p>
          Your form has been successfully submitted to our Support Team.<br /><br />

          We have received your information and will review it accordingly.<br /><br />

          Please check your inbox or spam/junk folder for the confirmation and
          verification email regarding your submission.
        </p>
        <button id="doneBtn" class="done-btn">Done</button>
      </div>
    </div>
  </body>
</html>
